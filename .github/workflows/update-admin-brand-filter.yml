name: Update Studio 47 admin branding and filter alignment
on:
  push:
    paths:
      - '.github/workflows/update-admin-brand-filter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()

          old_sidebar='<aside class="sidebar" id="mobileDrawer"><div class="brand"><div class="mark">47</div>'
          new_sidebar='<aside class="sidebar" id="mobileDrawer"><div class="brand"><img class="sidebar-logo" src="images/logo.png" alt="Studio 47 logo">'
          if old_sidebar not in s:
              raise SystemExit('Sidebar 47 mark pattern not found')
          s=s.replace(old_sidebar,new_sidebar,1)

          anchor='.brand strong{display:block;font:400 1.14rem Georgia,serif}'
          logo_css='.sidebar-logo{width:44px;height:44px;flex:0 0 44px;border-radius:50%;object-fit:cover;display:block}'+anchor
          if anchor not in s:
              raise SystemExit('Brand CSS anchor not found')
          s=s.replace(anchor,logo_css,1)

          mobile_anchor='font-size:0!important;justify-content:center!important;'
          mobile_fix='font-size:0!important;justify-content:center!important;gap:0!important;display:grid!important;place-items:center!important;'
          if mobile_anchor not in s:
              raise SystemExit('Mobile filter alignment anchor not found')
          s=s.replace(mobile_anchor,mobile_fix,1)

          mobile_logo='.mark{width:38px;height:38px}'
          mobile_logo_fix='.mark{width:38px;height:38px}.sidebar-logo{width:38px;height:38px;flex-basis:38px}'
          if mobile_logo in s:
              s=s.replace(mobile_logo,mobile_logo_fix,1)

          p.write_text(s)
          PY
          rm .github/workflows/update-admin-brand-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/update-admin-brand-filter.yml
          git commit -m "Use Studio 47 logo in admin sidebar and center filter icon"
          git push origin main
