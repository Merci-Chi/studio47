name: Fix Studio 47 filter centering and sign out placement
on:
  push:
    paths:
      - '.github/workflows/fix-filter-signout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()

          old='''<div class="nav-label">Website</div><nav class="nav"><button data-page="help"><span class="ico"><i class="fa-regular fa-circle-question"></i></span>Help &amp; Requests</button><a href="index.html" target="_blank"><span class="ico"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>View site</a><button id="out"><span class="ico"><i class="fa-solid fa-right-from-bracket"></i></span>Sign out</button></nav><div class="sidebar-card"><small>Signed in as</small><strong>${esc(staffProfile?.stylist_name||session.user.email)}</strong><p>${esc(session.user.email)}</p></div>'''
          new='''<div class="nav-label">Website</div><nav class="nav"><button data-page="help"><span class="ico"><i class="fa-regular fa-circle-question"></i></span>Help &amp; Requests</button><a href="index.html" target="_blank"><span class="ico"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>View site</a></nav><div class="sidebar-card"><small>Signed in as</small><strong>${esc(staffProfile?.stylist_name||session.user.email)}</strong><p>${esc(session.user.email)}</p></div><button id="out" class="sidebar-signout" type="button"><span class="ico"><i class="fa-solid fa-right-from-bracket"></i></span>Sign out</button>'''
          if old not in s:
              raise SystemExit('Final sidebar markup target not found')
          s=s.replace(old,new,1)

          marker='/* FINAL_FILTER_SIGNOUT_FIX */'
          style='''\n<style>\n/* FINAL_FILTER_SIGNOUT_FIX */\n.appointment-filter-btn{display:grid!important;place-items:center!important;padding:0!important;}\n.appointment-filter-btn i{display:block!important;width:auto!important;height:auto!important;line-height:1!important;margin:0!important;position:static!important;transform:none!important;}\n.sidebar-signout{width:100%;margin-top:10px;border:1px solid #ffffff26;border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:11px;background:#ffffff14;color:#fff;text-align:left;font-weight:700;}\n.sidebar-signout:hover{background:#ffffff21;}\n@media(max-width:760px){\n  .appointment-filter-btn{display:grid!important;place-items:center!important;align-items:center!important;justify-items:center!important;}\n  .appointment-filter-btn i{display:block!important;width:auto!important;height:auto!important;line-height:1!important;margin:0!important;position:static!important;top:auto!important;}\n  .sidebar-signout{min-height:54px;margin-top:10px;padding:11px 13px;border-radius:14px;font-size:.95rem;}\n}\n</style>\n'''
          if marker in s:
              start=s.rfind('<style>',0,s.find(marker))
              end=s.find('</style>',s.find(marker))
              if start!=-1 and end!=-1:
                  s=s[:start]+s[end+8:]
          s=s.replace('</body>',style+'</body>',1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-filter-signout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/fix-filter-signout.yml
          git commit -m "Center appointment filter icon and move sign out"
          git push
