name: Raise Studio 47 mobile header
on:
  push:
    paths:
      - '.github/workflows/raise-mobile-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin mobile header position
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          old=".topbar{top:max(8px,env(safe-area-inset-top))!important;height:60px!important;margin-top:8px!important;padding:0 12px!important}"
          new=".topbar{top:4px!important;height:60px!important;margin-top:0!important;padding:0 12px!important}"
          if old not in s:
              raise SystemExit('Current mobile topbar rule not found')
          s=s.replace(old,new,1)
          marker='@media(max-width:760px){\n'
          standalone='@media(max-width:760px) and (display-mode:standalone){main{padding-top:calc(env(safe-area-inset-top) + 2px)!important}.topbar{top:calc(env(safe-area-inset-top) + 2px)!important;margin-top:0!important}}\n'
          if standalone not in s:
              s=s.replace(marker,standalone+marker,1)
          p.write_text(s)
          PY
          rm .github/workflows/raise-mobile-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/raise-mobile-header.yml
          git commit -m "Raise Studio 47 mobile header"
          git push
