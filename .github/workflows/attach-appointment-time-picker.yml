name: Attach custom appointment time picker
on:
  push:
    paths:
      - '.github/workflows/attach-appointment-time-picker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach picker script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          tag='<script src="admin-appointment-time-picker.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Closing body tag not found')
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s)
          PY
          rm .github/workflows/attach-appointment-time-picker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/attach-appointment-time-picker.yml
          git commit -m "Use custom appointment time picker"
          git push