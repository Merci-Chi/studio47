name: Precisely center appointment filter icon
on:
  push:
    paths:
      - '.github/workflows/final-filter-center.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center filter glyph exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          marker='/* PRECISE_FILTER_CENTER */'
          style='''\n<style>\n/* PRECISE_FILTER_CENTER */\n.appointment-filter-btn{position:relative!important;padding:0!important;}\n.appointment-filter-btn i{position:absolute!important;left:50%!important;top:50%!important;margin:0!important;width:max-content!important;height:max-content!important;line-height:1!important;transform:translate(-50%,-50%)!important;display:block!important;}\n</style>\n'''
          if marker in s:
              start=s.rfind('<style>',0,s.find(marker))
              end=s.find('</style>',s.find(marker))
              if start!=-1 and end!=-1:
                  s=s[:start]+s[end+8:]
          if '</body>' not in s:
              raise SystemExit('Closing body tag not found')
          s=s.replace('</body>',style+'</body>',1)
          p.write_text(s)
          PY
          rm .github/workflows/final-filter-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/final-filter-center.yml
          git commit -m "Precisely center appointment filter icon"
          git push
