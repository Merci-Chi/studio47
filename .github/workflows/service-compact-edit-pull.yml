name: Compact services edit mode and pull refresh
on:
  push:
    paths:
      - '.github/workflows/service-compact-edit-pull.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach services enhancement assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="admin-services-enhancements.css">'
          js='<script src="admin-services-enhancements.js"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
          rm .github/workflows/service-compact-edit-pull.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/service-compact-edit-pull.yml
          git commit -m "Enable compact services and pull refresh"
          git push
