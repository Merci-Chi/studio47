name: Compact services edit mode and pull refresh
on:
  push:
    paths:
      - '.github/workflows/service-compact-edit-pull.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Studio 47 admin services and pull refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          marker='/* SERVICES_COMPACT_EDIT_PULL */'
          if marker in s:
              start=s.rfind('<style>',0,s.find(marker))
              end=s.find('</script>',s.find(marker))
              if start!=-1 and end!=-1:
                  s=s[:start]+s[end+9:]
          payload="""
<style>
/* SERVICES_COMPACT_EDIT_PULL */
.services-compact-page{padding:24px 0 10px}.services-compact-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.services-compact-head h1{margin:6px 0 3px;font:400 clamp(2.25rem,5vw,3.35rem)/1 Georgia,serif}.services-compact-head p{margin:0;color:var(--muted)}.services-compact-tools{display:flex;gap:8px;align-items:center}.service-tool-btn{width:46px;height:46px;padding:0;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--wine);display:grid;place-items:center;font-size:1rem}.service-tool-btn.active{background:var(--pink);border-color:var(--pink);color:#fff}.services-compact-list{display:grid;gap:8px}.service-compact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);min-height:58px}.service-compact-name{min-width:0}.service-compact-name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.96rem}.service-compact-name small{display:block;margin-top:2px;color:var(--muted);font-size:.68rem}.service-compact-price{font:700 1.02rem Georgia,serif;white-space:nowrap}.service-compact-description{grid-column:1/-1;margin:2px 0 0;color:var(--muted);font-size:.75rem}.service-compact-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:7px;padding-top:4px}.service-action-icon{width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--wine);display:grid;place-items:center}.service-action-icon.danger{background:#fff0f2;color:var(--red);border-color:#f3cbd3}.service-action-icon.live{background:#e8f7f1;color:var(--green);border-color:#cae9de}.service-action-icon.draft{background:#fff0f2;color:var(--red);border-color:#f3cbd3}.service-action-icon:disabled{opacity:.3;cursor:not-allowed}.service-edit-note{margin:2px 0 10px;color:var(--muted);font-size:.72rem}.pull-refresh-indicator{position:fixed;z-index:95;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translate(-50%,-140%);opacity:0;pointer-events:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--wine);box-shadow:0 10px 28px #46082b22;font-size:.72rem;font-weight:800;transition:transform .16s ease,opacity .16s ease}.pull-refresh-indicator.visible{opacity:1}.pull-refresh-indicator.ready i{transform:rotate(180deg)}.pull-refresh-indicator.refreshing i{animation:servicePullSpin .7s linear infinite}@keyframes servicePullSpin{to{transform:rotate(360deg)}}
html[data-theme="dark"] .service-tool-btn,html[data-theme="dark"] .service-compact-row,html[data-theme="dark"] .service-action-icon,html[data-theme="dark"] .pull-refresh-indicator{background:#191216;color:#fff5fa;border-color:#55313f}html[data-theme="dark"] .service-tool-btn.active{background:var(--pink);border-color:var(--pink)}
@media(max-width:760px){.services-compact-page{padding:18px 0 8px}.services-compact-head{align-items:center;gap:10px}.services-compact-head h1{font-size:2.35rem}.services-compact-tools{gap:7px}.service-tool-btn{width:44px;height:44px;border-radius:12px}.service-compact-row{padding:11px 12px;min-height:54px}.service-compact-actions{gap:6px}.service-action-icon{width:36px;height:36px}.pull-refresh-indicator{top:calc(env(safe-area-inset-top) + 62px)}}
</style>
<script>
let servicesCompactEditMode=false;
function ownerServicesCompactFinal(){
  compactPageHeading('Menu & Pricing');
  const services=orderedServices();
  const rows=services.map((item,index)=>{
    const description=String(item.description||'').trim();
    const edit=servicesCompactEditMode;
    return `<article class="service-compact-row" data-search="${esc(`${item.name||''} ${item.price||''} ${description}`.toLowerCase())}"><div class="service-compact-name"><strong>${esc(item.name||'Untitled service')}</strong>${edit?`<small>${item.is_live?'Live':'Not live'} · #${index+1}</small>`:''}</div><span class="service-compact-price">${esc(displayPrice(item.price))}</span>${edit&&description?`<p class="service-compact-description">${esc(description)}</p>`:''}${edit?`<div class="service-compact-actions"><button class="service-action-icon" type="button" data-service-compact-edit="${item.id}" aria-label="Edit ${esc(item.name||'service')}"><i class="fa-solid fa-pen"></i></button><button class="service-action-icon ${item.is_live?'live':'draft'}" type="button" data-service-compact-live="${item.id}" data-live="${item.is_live}" aria-label="${item.is_live?'Hide':'Publish'} ${esc(item.name||'service')}"><i class="fa-solid ${item.is_live?'fa-eye':'fa-eye-slash'}"></i></button><button class="service-action-icon" type="button" data-service-compact-move="${item.id}" data-direction="-1" aria-label="Move ${esc(item.name||'service')} up" ${index===0?'disabled':''}><i class="fa-solid fa-arrow-up"></i></button><button class="service-action-icon" type="button" data-service-compact-move="${item.id}" data-direction="1" aria-label="Move ${esc(item.name||'service')} down" ${index===services.length-1?'disabled':''}><i class="fa-solid fa-arrow-down"></i></button><button class="service-action-icon danger" type="button" data-service-compact-delete="${item.id}" aria-label="Delete ${esc(item.name||'service')}"><i class="fa-solid fa-trash"></i></button></div>`:''}</article>`;
  }).join('');
  document.querySelector('#view').innerHTML=`<section class="services-compact-page"><div class="services-compact-head"><div><div class="eyebrow">Services</div><h1>Menu &amp; Pricing</h1><p>${servicesCompactEditMode?'Edit, reorder, publish, or delete services.':'${services.length} service${services.length===1?'':'s'}.'}</p></div><div class="services-compact-tools"><button class="service-tool-btn" id="serviceCompactAdd" type="button" aria-label="Add service" title="Add service"><i class="fa-solid fa-plus"></i></button><button class="service-tool-btn ${servicesCompactEditMode?'active':''}" id="serviceCompactEditToggle" type="button" aria-label="${servicesCompactEditMode?'Finish editing':'Edit services'}" title="${servicesCompactEditMode?'Done':'Edit'}"><i class="fa-solid ${servicesCompactEditMode?'fa-check':'fa-pen'}"></i></button><button class="service-tool-btn" id="serviceCompactRefresh" type="button" aria-label="Refresh services" title="Refresh"><i class="fa-solid fa-rotate"></i></button></div></div>${servicesCompactEditMode?'<p class="service-edit-note">Use the arrows to change the website order. Tap the eye to publish or hide a service.</p>':''}<div class="services-compact-list">${rows||'<div class="empty">No services yet.</div>'}</div></section>`;
  document.querySelector('#serviceCompactAdd').onclick=()=>editor();
  document.querySelector('#serviceCompactEditToggle').onclick=()=>{servicesCompactEditMode=!servicesCompactEditMode;ownerServicesCompactFinal()};
  document.querySelector('#serviceCompactRefresh').onclick=()=>{servicesCompactEditMode=false;load(true)};
  if(!servicesCompactEditMode)return;
  document.querySelectorAll('[data-service-compact-edit]').forEach(button=>button.onclick=()=>editor(services.find(item=>item.id===button.dataset.serviceCompactEdit)));
  document.querySelectorAll('[data-service-compact-live]').forEach(button=>button.onclick=()=>toggle(button.dataset.serviceCompactLive,button.dataset.live!=='true'));
  document.querySelectorAll('[data-service-compact-move]').forEach(button=>button.onclick=()=>moveService(button.dataset.serviceCompactMove,Number(button.dataset.direction)));
  document.querySelectorAll('[data-service-compact-delete]').forEach(button=>button.onclick=()=>remove(button.dataset.serviceCompactDelete));
}
const renderBeforeServicesCompactFinal=render;
render=function(){if(isOwner()&&pageName==='services')return ownerServicesCompactFinal();return renderBeforeServicesCompactFinal()};

const pullRefreshIndicator=document.createElement('div');
pullRefreshIndicator.className='pull-refresh-indicator';
pullRefreshIndicator.innerHTML='<i class="fa-solid fa-arrow-down"></i><span>Pull to refresh</span>';
document.body.appendChild(pullRefreshIndicator);
let pullStartY=null,pullDistance=0,pullEligible=false,pullRefreshing=false;
const currentScrollTop=()=>document.scrollingElement?.scrollTop||document.documentElement.scrollTop||document.body.scrollTop||0;
document.addEventListener('touchstart',event=>{
  if(!window.matchMedia('(max-width:760px)').matches||pullRefreshing||document.querySelector('.modal-bg')||document.querySelector('.app.drawer-open'))return;
  if(currentScrollTop()>0)return;
  pullStartY=event.touches[0]?.clientY??null;pullDistance=0;pullEligible=pullStartY!==null;
},{passive:true});
document.addEventListener('touchmove',event=>{
  if(!pullEligible||pullStartY===null||pullRefreshing)return;
  const y=event.touches[0]?.clientY??pullStartY,delta=Math.max(0,y-pullStartY);
  if(delta<=0)return;
  pullDistance=Math.min(delta,110);
  if(pullDistance>6)event.preventDefault();
  const progress=Math.min(pullDistance/76,1),offset=-140+(progress*155);
  pullRefreshIndicator.classList.add('visible');
  pullRefreshIndicator.classList.toggle('ready',pullDistance>=76);
  pullRefreshIndicator.style.transform=`translate(-50%,${offset}%)`;
  pullRefreshIndicator.querySelector('span').textContent=pullDistance>=76?'Release to refresh':'Pull to refresh';
},{passive:false});
document.addEventListener('touchend',async()=>{
  if(!pullEligible){pullStartY=null;return}
  const shouldRefresh=pullDistance>=76;
  pullEligible=false;pullStartY=null;
  if(!shouldRefresh){pullRefreshIndicator.classList.remove('visible','ready');pullRefreshIndicator.style.transform='translate(-50%,-140%)';return}
  pullRefreshing=true;servicesCompactEditMode=false;pullRefreshIndicator.classList.remove('ready');pullRefreshIndicator.classList.add('visible','refreshing');pullRefreshIndicator.style.transform='translate(-50%,12%)';pullRefreshIndicator.querySelector('span').textContent='Refreshing…';
  try{await load(true)}finally{setTimeout(()=>{pullRefreshing=false;pullDistance=0;pullRefreshIndicator.classList.remove('visible','refreshing');pullRefreshIndicator.style.transform='translate(-50%,-140%)';pullRefreshIndicator.querySelector('span').textContent='Pull to refresh'},350)}
},{passive:true});
</script>
"""
          if '</body>' not in s:
              raise SystemExit('Closing body tag not found')
          s=s.replace('</body>',payload+'</body>',1)
          p.write_text(s)
          PY
          rm .github/workflows/service-compact-edit-pull.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/service-compact-edit-pull.yml
          git commit -m "Compact services and add pull refresh"
          git push
