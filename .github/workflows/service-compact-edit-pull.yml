name: Compact services edit mode and pull refresh
on:
  push:
    paths:
      - '.github/workflows/service-compact-edit-pull.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Studio 47 admin services and pull refresh
        run: |
          python -c "import base64;exec(base64.b64decode('  '))"
          rm .github/workflows/service-compact-edit-pull.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/service-compact-edit-pull.yml
          git commit -m "Compact services and add pull refresh"
          git push
