name: Fix Kiara owner access

on:
  push:
    paths:
      - '.github/workflows/fix-kiara-owner.yml'

permissions:
  contents: write

jobs:
  patch-owner-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch owner permission check
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin.html')
          text = path.read_text()
          old = "const isOwner=()=>staffProfile?.active===true&&staffProfile?.role==='owner';"
          new = "const isOwner=()=>currentEmail()==='kiara@steadyhandsop.com'||(staffProfile?.active===true&&staffProfile?.role==='owner');"

          if old not in text:
              if new in text:
                  print('Owner access patch is already present.')
              else:
                  raise SystemExit('Expected isOwner line was not found; refusing to modify admin.html.')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print('Patched Kiara owner access.')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-kiara-owner.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/fix-kiara-owner.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Fix Kiara owner access"
          git push origin main
