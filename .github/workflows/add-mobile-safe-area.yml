name: Add Studio 47 mobile safe area
on:
  push:
    paths:
      - '.github/workflows/add-mobile-safe-area.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add minimal iPhone status-bar breathing room
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          marker='/* MOBILE_SAFE_AREA_BREATHER */'
          style='''\n<style>\n/* MOBILE_SAFE_AREA_BREATHER */\n@media(max-width:760px){\n  .topbar{top:0!important;margin-top:0!important;height:calc(60px + env(safe-area-inset-top))!important;padding-top:env(safe-area-inset-top)!important;box-sizing:border-box!important;}\n}\n</style>\n'''
          if marker in s:
              start=s.rfind('<style>',0,s.find(marker))
              end=s.find('</style>',s.find(marker))
              if start!=-1 and end!=-1:
                  s=s[:start]+s[end+8:]
          if '</body>' not in s:
              raise SystemExit('Closing body tag not found')
          s=s.replace('</body>',style+'</body>',1)
          p.write_text(s)
          PY
          rm .github/workflows/add-mobile-safe-area.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/add-mobile-safe-area.yml
          git commit -m "Add minimal mobile safe area spacing"
          git push
