vals=function(r){return pageName==='content'?[r.title||r.content_key,r.section,r.content_value||r.image_url]:pageName==='services'?[r.name,displayPrice(r.price),r.description]:[r.author,'★'.repeat(r.rating),r.body]};
fields=function(r={}){
  if(pageName==='content')return `<div class="form-grid"><div class="field full"><label>Photo title</label><input name="title" required value="${esc(r.title)}" placeholder="Example: Balayage transformation"></div><div class="field full"><label>Upload photo</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp" ${r.id?'':'required'}></div>${r.image_url?`<div class="field full"><label>Current photo</label><img src="${esc(r.image_url)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px"></div>`:''}<div class="field"><label>Sort order</label><input name="sort_order" type="number" value="${r.sort_order||0}"></div></div>`;
  if(pageName==='services')return `<div class="form-grid"><div class="field full"><label>Name</label><input name="name" required value="${esc(r.name)}"></div><div class="field"><label>Price</label><div class="money-input"><span>$</span><input name="price" required inputmode="decimal" value="${esc(cleanPrice(r.price))}" placeholder="0"></div></div><div class="field"><label>Sort order</label><input name="sort_order" type="number" value="${r.sort_order||0}"></div><div class="field full"><label>Description</label><textarea name="description">${esc(r.description)}</textarea></div></div>`;
  const rating=Number(r.rating)||5;
  return `<div class="form-grid"><div class="field"><label>Client</label><input name="author" required value="${esc(r.author)}"></div><div class="field"><label>Rating</label><div class="star-picker" role="radiogroup" aria-label="Rating">${[5,4,3,2,1].map(n=>`<input id="rating-${n}" name="rating" type="radio" value="${n}" ${rating===n?'checked':''}><label for="rating-${n}" aria-label="${n} star${n===1?'':'s'}">★</label>`).join('')}</div></div><div class="field full"><label>Review</label><textarea name="body" rows="5" required>${esc(r.body)}</textarea></div><div class="field full"><label>Where is this review from?</label><input name="source" value="${esc(r.source||'')}" placeholder="Example: Google, Yelp, Facebook, or in salon"></div></div>`;
};
boot();
</script></body></html>
