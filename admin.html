<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio 47 — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--wine:#580330;--pink:#cf0d76;--rose:#efabc9;--bg:#f8f3f6;--card:#fff;--ink:#28151f;--muted:#826c77;--line:#ead8e1;--green:#23815e;--red:#bd2940}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Arial,sans-serif}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:var(--wine);color:#fff;padding:24px 16px}.brand{padding:6px 10px 24px;font:1.5rem Georgia,serif}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:8px;padding:12px;text-align:left;background:transparent;color:#ffffffc4;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff1f;color:#fff}.side a{display:block;margin:25px 10px;color:var(--rose)}main{padding:30px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font:2.3rem Georgia,serif}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #5803300c}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px 18px;border-bottom:1px solid var(--line)}.btn{border:0;border-radius:7px;padding:10px 13px;background:var(--pink);color:#fff;font-weight:800;cursor:pointer}.btn.ghost{background:#fff;color:var(--wine);border:1px solid var(--line)}.btn.danger{background:var(--red)}table{width:100%;border-collapse:collapse}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.68rem;text-transform:uppercase}.toggle{width:64px;border:0;border-radius:99px;padding:6px;color:#fff;font-size:.65rem;font-weight:900;cursor:pointer}.toggle.live{background:var(--green)}.toggle.draft{background:var(--red)}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:38px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#2c071d99}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px;background:#fff;border-radius:14px}.dialog h2{margin:0 0 18px;font:1.8rem Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:.7rem;font-weight:800;color:var(--muted)}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:13px;border-radius:8px;background:#fff3c8;color:#6b4c00;margin-bottom:16px}.success{background:#e5f6ee;color:#185f46}.login{max-width:480px;margin:80px auto;padding:26px}.login h1{font:2rem Georgia,serif}.stack{display:grid;gap:12px}.setup textarea{min-height:240px;font:12px/1.4 monospace}.toast{position:fixed;right:20px;bottom:20px;z-index:30;padding:12px 16px;background:var(--wine);color:#fff;border-radius:8px}@media(max-width:760px){.app{display:block}.side{padding:12px}.brand{padding:4px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side a{display:none}main{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table{overflow:auto}}
</style></head><body><div id="root"></div><script>
const CFG='studio47-supabase-config',root=document.querySelector('#root');let cfg=JSON.parse(localStorage.getItem(CFG)||'null'),db=null,session=null,current='content';
const SQL=`create extension if not exists pgcrypto;
create table if not exists public.site_content (id uuid primary key default gen_random_uuid(), section text not null, content_key text unique not null, title text, content_value text, image_url text, is_live boolean not null default false, sort_order int not null default 0, updated_at timestamptz default now());
create table if not exists public.services (id uuid primary key default gen_random_uuid(), name text not null, description text default '', price text not null, is_live boolean not null default false, sort_order int not null default 0, updated_at timestamptz default now());
create table if not exists public.reviews (id uuid primary key default gen_random_uuid(), author text not null, rating int not null check (rating between 1 and 5), body text not null, source text default 'manual', is_live boolean not null default false, created_at timestamptz default now());
alter table public.site_content enable row level security; alter table public.services enable row level security; alter table public.reviews enable row level security;
grant select on public.site_content,public.services,public.reviews to anon; grant insert on public.reviews to anon; grant select,insert,update,delete on public.site_content,public.services,public.reviews to authenticated;
create policy "public reads live content" on public.site_content for select to anon using (is_live=true); create policy "admin content" on public.site_content for all to authenticated using (true) with check (true);
create policy "public reads live services" on public.services for select to anon using (is_live=true); create policy "admin services" on public.services for all to authenticated using (true) with check (true);
create policy "public reads live reviews" on public.reviews for select to anon using (is_live=true); create policy "public submits pending reviews" on public.reviews for insert to anon with check (is_live=false and source='website'); create policy "admin reviews" on public.reviews for all to authenticated using (true) with check (true);
insert into public.site_content(section,content_key,title,content_value,is_live,sort_order) values ('general','business_name','Business name','Studio 47 Hair Salon',true,1),('general','announcement','Announcement','Studio 47 Hair Salon · Las Vegas, Nevada',true,2),('hero','hero_eyebrow','Hero eyebrow','Full-service salon · Las Vegas',true,3),('hero','hero_title','Hero title','Studio 47 Hair Salon',true,4),('hero','hero_text','Hero text','Haircuts, color, highlights and styling for the whole family.',true,5),('contact','address','Address','1449 N. Jones Blvd., Las Vegas, NV 89108',true,6),('contact','phone','Phone','(702) 636-8532',true,7) on conflict(content_key) do nothing;
insert into public.services(name,description,price,is_live,sort_order) select * from (values ('Women''s Haircut','Cut and finish','$35+',true,1),('Men''s Haircut','Classic cut','$20+',true,2),('Hair Color','Consultation included','$60+',true,3),('Highlights','Custom placement','$85+',true,4)) v(name,description,price,is_live,sort_order) where not exists(select 1 from public.services);`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=s=>{const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2400)};
function setup(){root.innerHTML=`<div class="login card setup"><h1>Connect Supabase</h1><p>Enter your project URL and public anon key. These are saved in this browser and shared with index.html on the same domain.</p><form class="stack" id="cfg"><input name="url" type="url" required placeholder="https://PROJECT.supabase.co" value="${esc(cfg?.url)}"><input name="key" required placeholder="Publishable / anon key" value="${esc(cfg?.key)}"><button class="btn">Save & connect</button></form><h3>One-time database setup</h3><p>Run this in Supabase → SQL Editor, then create an admin user in Authentication.</p><textarea readonly>${esc(SQL)}</textarea><button class="btn ghost" id="copy">Copy SQL</button></div>`;cfgForm=document.querySelector('#cfg');cfgForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);localStorage.setItem(CFG,JSON.stringify({url:f.get('url').replace(/\/$/,''),key:f.get('key')}));location.reload()};document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(SQL).then(()=>toast('SQL copied'))}
async function boot(){if(!cfg?.url||!cfg?.key)return setup();db=supabase.createClient(cfg.url,cfg.key);const {data}=await db.auth.getSession();session=data.session;if(!session)return login();app()}
function login(){root.innerHTML=`<form class="login card stack" id="login"><h1>Studio 47 Admin</h1><div class="notice">Sign in with a Supabase Authentication user.</div><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button class="btn">Sign in</button><button type="button" class="btn ghost" id="reconfig">Supabase setup</button></form>`;document.querySelector('#reconfig').onclick=setup;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return alert(error.message);session=true;app()}}
function app(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand">Studio 47 Admin</div><div class="nav">${['content','services','reviews','setup'].map(x=>`<button data-page="${x}" class="${x===current?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><a href="index.html" target="_blank">View public site ↗</a></aside><main><div class="top"><h1 id="title">Content</h1><button class="btn ghost" id="signout">Sign out</button></div><div id="page"></div></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;app();loadPage()});document.querySelector('#signout').onclick=async()=>{await db.auth.signOut();login()};loadPage()}
async function loadPage(){document.querySelector('#title').textContent=current[0].toUpperCase()+current.slice(1);if(current==='setup')return renderSetup();const page=document.querySelector('#page'),table=current==='content'?'site_content':current;page.innerHTML='<div class="card empty">Loading…</div>';const {data,error}=await db.from(table).select('*').order(current==='reviews'?'created_at':'sort_order',{ascending:current!=='reviews'});if(error)return page.innerHTML=`<div class="notice">${esc(error.message)} — check Setup.</div>`;renderTable(data)}
function renderTable(rows){const page=document.querySelector('#page'),labels=current==='content'?['Title','Section','Value']:current==='services'?['Name','Price','Description']:['Author','Rating','Review'];page.innerHTML=`<div class="card"><div class="bar"><strong>${rows.length} ${current}</strong><button class="btn" id="add">+ Add</button></div><div class="table"><table><thead><tr>${labels.map(x=>`<th>${x}</th>`).join('')}<th>Visibility</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>row(r)).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">Nothing here yet.</div>'}</div>`;document.querySelector('#add').onclick=()=>edit();document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle,b.dataset.live!=='true'));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit,rows.find(r=>r.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
function row(r){const cells=current==='content'?[r.title||r.content_key,r.section,r.content_value||r.image_url]:current==='services'?[r.name,r.price,r.description]:[r.author,'★'.repeat(r.rating),r.body];return `<tr>${cells.map(x=>`<td>${esc(x)}</td>`).join('')}<td><button class="toggle ${r.is_live?'live':'draft'}" data-toggle="${r.id}" data-live="${r.is_live}">${r.is_live?'LIVE':'NOT LIVE'}</button></td><td><div class="actions"><button class="btn ghost" data-edit="${r.id}">Edit</button><button class="btn danger" data-delete="${r.id}">Delete</button></div></td></tr>`}
async function toggle(id,is_live){const {error}=await db.from(current==='content'?'site_content':current).update({is_live}).eq('id',id);if(error)return alert(error.message);toast(is_live?'Made live':'Taken offline');loadPage()}
function fields(r={}){if(current==='content')return `<div class="grid"><div class="field"><label>Section</label><select name="section"><option>general</option><option>hero</option><option>gallery</option><option>contact</option></select></div><div class="field"><label>Unique key</label><input name="content_key" required value="${esc(r.content_key)}"></div><div class="field full"><label>Admin title</label><input name="title" required value="${esc(r.title)}"></div><div class="field full"><label>Text value</label><textarea name="content_value" rows="4">${esc(r.content_value)}</textarea></div><div class="field full"><label>Image URL (gallery)</label><input name="image_url" type="url" value="${esc(r.image_url)}"></div><div class="field"><label>Sort order</label><input name="sort_order" type="number" value="${r.sort_order||0}"></div></div>`;if(current==='services')return `<div class="grid"><div class="field full"><label>Name</label><input name="name" required value="${esc(r.name)}"></div><div class="field"><label>Price</label><input name="price" required value="${esc(r.price)}"></div><div class="field"><label>Sort order</label><input name="sort_order" type="number" value="${r.sort_order||0}"></div><div class="field full"><label>Description</label><textarea name="description">${esc(r.description)}</textarea></div></div>`;return `<div class="grid"><div class="field"><label>Author</label><input name="author" required value="${esc(r.author)}"></div><div class="field"><label>Rating</label><select name="rating">${[5,4,3,2,1].map(n=>`<option ${r.rating===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field full"><label>Review</label><textarea name="body" rows="5" required>${esc(r.body)}</textarea></div><input type="hidden" name="source" value="${esc(r.source||'manual')}"></div>`}
function edit(id,r={}){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="dialog"><h2>${id?'Edit':'Add'} ${current.slice(0,-1)}</h2><form id="editor">${fields(r)}<div class="modal-actions"><button type="button" class="btn ghost cancel">Cancel</button><button class="btn">Save as ${r.is_live?'live':'not live'}</button></div></form></div>`;document.body.append(m);m.querySelector('.cancel').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};m.querySelector('form').onsubmit=async e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));if(current==='services'||current==='content')obj.sort_order=+obj.sort_order||0;if(current==='reviews')obj.rating=+obj.rating;obj.is_live=!!r.is_live;const table=current==='content'?'site_content':current;const q=id?db.from(table).update(obj).eq('id',id):db.from(table).insert(obj);const {error}=await q;if(error)return alert(error.message);m.remove();toast('Saved');loadPage()}}
async function remove(id){if(!confirm('Delete this item permanently?'))return;const {error}=await db.from(current==='content'?'site_content':current).delete().eq('id',id);if(error)return alert(error.message);toast('Deleted');loadPage()}
function renderSetup(){const page=document.querySelector('#page');page.innerHTML=`<div class="card setup" style="padding:22px"><div class="notice success">Connected to ${esc(cfg.url)}</div><h2>Database schema</h2><p>Run once in Supabase SQL Editor. Public visitors can only read live records and submit pending reviews; authenticated admins can manage everything.</p><textarea id="sql" readonly>${esc(SQL)}</textarea><div class="actions"><button class="btn" id="copy">Copy SQL</button><button class="btn ghost" id="change">Change connection</button></div></div>`;document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(SQL).then(()=>toast('SQL copied'));document.querySelector('#change').onclick=setup}boot();
</script></body></html>
